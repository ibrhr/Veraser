[project]
name = "veraser"
version = "0.1.0"
description = "FastAPI service for video object removal workflows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "imageio[ffmpeg]>=2.37.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]
gpu = [
    "gdown>=5.2.0",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.10.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "vot-toolkit>=0.7.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
